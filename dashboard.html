<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%234a9eff' width='100' height='100' rx='20'/><text x='50' y='65' font-size='60' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'>⚡</text></svg>" type="image/svg+xml">
    <title>PromptQuest - Student Progress Dashboard</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a80;
            --accent-blue: #4a9eff;
            --accent-purple: #a855f7;
            --accent-green: #22c55e;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --border-color: #2a2a40;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .dashboard {
            max-width: 900px;
            margin: 0 auto;
        }

        .dash-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .dash-header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .dash-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .dash-credit {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .dash-credit strong {
            color: var(--accent-blue);
        }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
        }

        .summary-card .value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-blue);
        }

        .summary-card .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Zone Table */
        .zone-section {
            margin-bottom: 30px;
        }

        .zone-section h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .zone-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .zone-table th {
            background: var(--bg-secondary);
            padding: 12px 16px;
            text-align: left;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        .zone-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .zone-table tr:last-child td {
            border-bottom: none;
        }

        .zone-table tr:hover td {
            background: rgba(74, 158, 255, 0.03);
        }

        .level-name {
            color: var(--text-primary);
        }

        .level-stars {
            color: var(--accent-orange);
            letter-spacing: 2px;
            font-size: 1rem;
        }

        .level-status {
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .level-status.done {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
        }

        .level-status.pending {
            background: rgba(106, 106, 128, 0.15);
            color: var(--text-muted);
        }

        /* Actions */
        .dash-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .empty-state a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .empty-state a:hover {
            text-decoration: underline;
        }

        /* Print styles */
        @media print {
            body { background: white; color: black; padding: 10px; }
            .dash-header h1 { -webkit-text-fill-color: black; }
            .summary-card .value { color: black; }
            .zone-table th { background: #f0f0f0; color: #333; }
            .zone-table td, .zone-table th { border-color: #ddd; }
            .dash-actions { display: none; }
            .level-stars { color: black; }
        }

        @media (max-width: 640px) {
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .zone-table { font-size: 0.8rem; }
            .zone-table th, .zone-table td { padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="dash-header">
            <h1>PromptQuest Progress</h1>
            <p>Student Score Dashboard</p>
            <p class="dash-credit">Created by <strong>Bharath Kumar</strong> | AWAI</p>
        </div>

        <div id="dashboard-content">
            <div class="empty-state">
                <h3>No Progress Data Found</h3>
                <p>Play the game first to see your scores here.</p>
                <p><a href="index.html">Go to PromptQuest</a></p>
            </div>
        </div>

        <div class="dash-actions" id="dash-actions" style="display: none;">
            <button class="btn btn-secondary" onclick="window.print()">&#128424; Print / Save PDF</button>
            <button class="btn btn-primary" onclick="window.location.href='index.html'">Back to Game</button>
        </div>
    </div>

    <script>
        // Zone and level data (must match game.js)
        const ZONES = [
            { id: 1, name: "Foundation Valley", icon: "&#127793;" },
            { id: 2, name: "Technique Tower", icon: "&#128295;" },
            { id: 3, name: "Refinement Ridge", icon: "&#128269;" },
            { id: 4, name: "Pitfall Peaks", icon: "&#9888;&#65039;" },
            { id: 5, name: "Mastery Mountain", icon: "&#127942;" }
        ];

        const LEVELS = [
            { id: "1-1", zone: 1, number: 1, title: "What is a Prompt?" },
            { id: "1-2", zone: 1, number: 2, title: "The Clarity Principle" },
            { id: "1-3", zone: 1, number: 3, title: "Adding Context" },
            { id: "1-4", zone: 1, number: 4, title: "The Anatomy of a Prompt" },
            { id: "2-1", zone: 2, number: 1, title: "Role-Based Prompting" },
            { id: "2-2", zone: 2, number: 2, title: "Chain of Thought" },
            { id: "2-3", zone: 2, number: 3, title: "Few-Shot Learning" },
            { id: "2-4", zone: 2, number: 4, title: "Structured Output" },
            { id: "3-1", zone: 3, number: 1, title: "Iterative Refinement" },
            { id: "3-2", zone: 3, number: 2, title: "Prompt Chaining" },
            { id: "3-3", zone: 3, number: 3, title: "System Prompts & Personas" },
            { id: "3-4", zone: 3, number: 4, title: "Handling Edge Cases" },
            { id: "4-1", zone: 4, number: 1, title: "Common Mistakes" },
            { id: "4-2", zone: 4, number: 2, title: "Hallucination Prevention" },
            { id: "4-3", zone: 4, number: 3, title: "Over vs Under-prompting" },
            { id: "4-4", zone: 4, number: 4, title: "Security & Ethics" },
            { id: "5-1", zone: 5, number: 1, title: "Business Use Cases" },
            { id: "5-2", zone: 5, number: 2, title: "Code Generation" },
            { id: "5-3", zone: 5, number: 3, title: "Multi-step Workflows" },
            { id: "5-4", zone: 5, number: 4, title: "The Perfect Prompt Challenge" }
        ];

        function loadProgress() {
            try {
                const saved = localStorage.getItem('promptquest_progress');
                if (saved) return JSON.parse(saved);
            } catch(e) {}
            return null;
        }

        function renderDashboard() {
            const data = loadProgress();
            const container = document.getElementById('dashboard-content');
            const actions = document.getElementById('dash-actions');

            if (!data || !data.progress || Object.keys(data.progress).length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No Progress Data Found</h3>
                        <p>Play the game first to see your scores here.</p>
                        <p><a href="index.html">Go to PromptQuest</a></p>
                    </div>`;
                actions.style.display = 'none';
                return;
            }

            const progress = data.progress;
            const totalStars = data.totalStars || 0;
            const levelsCompleted = data.levelsCompleted || 0;
            const maxStars = 60;
            const percentage = Math.round((totalStars / maxStars) * 100);

            let html = '';

            // Summary cards
            html += '<div class="summary-grid">';
            html += `<div class="summary-card"><div class="value">${levelsCompleted}/20</div><div class="label">Levels Completed</div></div>`;
            html += `<div class="summary-card"><div class="value">${totalStars}/${maxStars}</div><div class="label">Stars Earned</div></div>`;
            html += `<div class="summary-card"><div class="value">${percentage}%</div><div class="label">Score</div></div>`;
            html += '</div>';

            // Zone tables
            ZONES.forEach(zone => {
                const zoneLevels = LEVELS.filter(l => l.zone === zone.id);
                const zoneStars = zoneLevels.reduce((sum, l) => sum + (progress[l.id]?.stars || 0), 0);
                const zoneMax = zoneLevels.length * 3;
                const zoneCompleted = zoneLevels.filter(l => progress[l.id]?.completed).length;

                html += `<div class="zone-section">`;
                html += `<h2>${zone.icon} ${zone.name} -- ${zoneCompleted}/${zoneLevels.length} levels, ${zoneStars}/${zoneMax} stars</h2>`;
                html += `<table class="zone-table">`;
                html += `<tr><th>#</th><th>Level</th><th>Stars</th><th>Status</th></tr>`;

                zoneLevels.forEach(level => {
                    const p = progress[level.id];
                    const stars = p ? '★'.repeat(p.stars) + '☆'.repeat(3 - p.stars) : '☆☆☆';
                    const status = p?.completed
                        ? `<span class="level-status done">Completed</span>`
                        : `<span class="level-status pending">Not started</span>`;

                    html += `<tr>
                        <td>${level.number}</td>
                        <td class="level-name">${level.title}</td>
                        <td class="level-stars">${stars}</td>
                        <td>${status}</td>
                    </tr>`;
                });

                html += `</table></div>`;
            });

            container.innerHTML = html;
            actions.style.display = 'flex';
        }

        // Load on page load
        renderDashboard();
    </script>
</body>
</html>
